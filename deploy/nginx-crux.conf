# nginx site for Crux. Install with:
#   sudo cp deploy/nginx-crux.conf /etc/nginx/sites-available/crux
#   sudo ln -s /etc/nginx/sites-available/crux /etc/nginx/sites-enabled/crux
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crux.jclife.online        # adds HTTPS
server {
    listen 80;
    server_name crux.jclife.online;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replies stream word by word; without these nginx holds them back until the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
